<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Muzhi-3d</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font: Merriweather -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --text: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Merriweather", serif;
      overflow: hidden;
    }

    /* Video background */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.35) contrast(1.05);
    }

    /* Subtle dark overlay for readability */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.85));
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      /* 👈 this is the fix */
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .content {
      max-width: 800px;
      animation: fadeIn 1.2s ease-out;
    }

    .title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: clamp(1rem, 2vw, 1.3rem);
      color: var(--muted);
      letter-spacing: 0.06em;
      line-height: 1.6;
    }

    .status-btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.9rem 2.2rem;
      border-radius: 999px;
      background: #ffffff;
      color: #000000;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: default;
      user-select: none;

      /* soft glow for cinematic feel */
      box-shadow:
        0 0 20px rgba(255, 255, 255, 0.15),
        0 4px 20px rgba(0, 0, 0, 0.4);

      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    /* subtle hover even though it's not clickable */
    .status-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 0 30px rgba(255, 255, 255, 0.25),
        0 6px 25px rgba(0, 0, 0, 0.5);
    }

    .subtitle,
    .status-btn {
      font-family: "Inter", system-ui, sans-serif;
    }


    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Optional: reduce motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      .content {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="bg.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="overlay"></div>

  <div class="container">
    <div class="content">
      <div class="title">Muzhi-3d</div>
      <div class="subtitle">
        Curve based polymodeller.
      </div>
      <div class="status-btn">In development</div>
    </div>
  </div>
  </div>

</body>

</html>
